name: CPU validation and publication replay

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install package and locked CPU environment
        run: python -m pip install -e . -r requirements-test.txt
      - name: Verify frozen publication inputs
        run: python scripts/reproduce_paper.py --check-only
      - name: Test public API, helpers and all 25 reference assets
        run: python -m unittest discover -s tests -v
      - name: Run the CPU quick start and NPZ interface
        run: |
          python examples/quickstart.py
          angle-nsi results/generated/quickstart/per_angle_images.npz --output results/generated/quickstart/cli_envelopes.npz
      - name: Build and inspect installable distributions
        run: |
          python -m pip install build==1.6.1
          python -m build
          python scripts/check_distribution.py

  core-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the core package
        run: python -m pip install .
      - name: Exercise the installed core outside the source directory
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import numpy as np; from angle_nsi import angle_nsi; b=np.ones((3,4,5),np.complex64); np.testing.assert_allclose(angle_nsi(b,[-4,-2,0,2,4]),0.25)"
          angle-nsi --help
