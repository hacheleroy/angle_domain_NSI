name: Paper reproducibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - name: Install validated CPU environment
        run: python -m pip install -r requirements-test.txt
      - name: Verify frozen publication inputs
        run: python scripts/reproduce_paper.py --check-only
      - name: Test beamforming helpers and reproduce the paper assets
        run: python -m unittest discover -s tests -v
